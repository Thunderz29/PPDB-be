basePath: /api
definitions:
  models.MasterSchool:
    properties:
      alamat_smp:
        type: string
      nama_smp:
        type: string
      smp_id:
        type: integer
    type: object
  models.MasterSchoolRequest:
    properties:
      alamat_smp:
        maxLength: 255
        type: string
      nama_smp:
        maxLength: 255
        type: string
    required:
    - alamat_smp
    - nama_smp
    type: object
  models.Parameter:
