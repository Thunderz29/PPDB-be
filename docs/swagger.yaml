paths:
  /health:
    get:
      description: Endpoint to check if the server is running and ready to accept
        requests.
      produces:
      - application/json
      responses:
        "200":
          description: Status OK
          schema:
            additionalProperties: true
            type: object
      summary: Check server status
      tags:
      - System
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password, returns access token
        (1 day), refresh token (7 days), and records the session.
      parameters:
      - description: Login Request Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Authenticate user and record session
      tags:
      - Auth
  /logout:
    post:
      consumes:
      - application/json
      description: Logs out the user by revoking the active session associated with
        the Bearer token.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user and invalidate session
      tags:
      - Auth
