      matpel_ujian1:
        type: integer
      matpel_ujian2:
        type: integer
      matpel_ujian3:
        type: integer
      matpel_ujian4:
        type: integer
      param_id:
        type: integer
      tahun_ajar:
        type: string
      tgl_param:
        type: string
      ups:
        type: number
      usm:
        type: number
    type: object
  models.ParameterRequest:
    properties:
      biaya_pendaftaran:
        type: number
      matpel_ujian1:
        type: integer
      matpel_ujian2:
        type: integer
      matpel_ujian3:
        type: integer
      matpel_ujian4:
        type: integer
      tahun_ajar:
        maxLength: 9
        type: string
      tgl_param:
        type: string
      ups:
        type: number
      usm:
        type: number
    required:
    - tahun_ajar
    type: object
  models.Role:
    properties:
      role_id:
        type: integer
      role_name:
        type: string
    type: object
  models.RoleRequest:
    properties:
      role_name:
        maxLength: 50
        type: string
    required:
    - role_name
    type: object
  models.SchoolProfile:
    properties:
      alamat:
        type: string
      id:
        type: integer
      informasi_lainnya:
        type: string
      logo:
        type: string
      mail:
        type: string
      nama_sekolah:
        type: string
      phone:
        type: string
      system_name:
        type: string
      tahun_berdiri:
        type: string
      tingkatan_sekolah:
        type: string
    type: object
  models.SchoolProfileRequest:
    properties:
      alamat:
        type: string
      informasi_lainnya:
        type: string
      logo:
        type: string
      mail:
        maxLength: 255
        type: string
      nama_sekolah:
        maxLength: 255
        type: string
      phone:
        maxLength: 255
        type: string
      system_name:
        maxLength: 255
        type: string
      tahun_berdiri:
        maxLength: 255
        type: string
      tingkatan_sekolah:
